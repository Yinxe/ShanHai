name: BDS server build (manual)
# Builds the dedicated-server (BDS / LeviLamina) package. Manual only: the
# Windows client release is the supported artifact pipeline, and the server port
# is rebuilt on demand.
#
# The final link step runs LiteLDev's prelink.exe against bedrock_runtime_data,
# which is a Windows-only tool, so this workflow is the supported build path:
# the SDK-free kernel and all offline checks also run here, on one machine.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish a GitHub release (tag bds-v<version>)'
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: xmake-io/github-action-setup-xmake@3a1a5dddfc7fa625d9a698738334bf55655a861a # v1
        with:
          xmake-version: '3.1.1'
          package-cache: true
          project-path: ports/bds-server
      # LeviLamina plus its SDK and prelink tooling dominate Configure time, so
      # cache the resolved package tree rather than only the registry index.
      - name: Cache xmake packages
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.LOCALAPPDATA }}\.xmake\packages
            ${{ env.LOCALAPPDATA }}\.xmake\cache
          key: xmake-${{ runner.os }}-${{ hashFiles('**/xmake.lua', '**/xmake/*.lua', '**/tooth.json') }}
          restore-keys: |
            xmake-${{ runner.os }}-
      - name: Install build tools
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vs = & $vswhere -latest -products '*' -version '[18.0,19.0)' -property installationPath
          $llvm = Join-Path $vs 'VC/Tools/Llvm/x64/bin'
          if (!(Test-Path (Join-Path $llvm 'clang-cl.exe'))) { throw 'Visual Studio 2026 LLVM is required' }
          $llvm | Out-File -FilePath $env:GITHUB_PATH -Append
          & (Join-Path $llvm 'clang-cl.exe') --version
          xmake --version
          python -m pip install numpy
          if ($LASTEXITCODE) { throw 'NumPy installation failed' }
      - name: Offline checks
        shell: pwsh
        run: |
          python -B -X utf8 tools/check_palette_contract.py
          python -B -X utf8 tools/check_release_text.py ports/bds-server/README.md
          python -B -X utf8 ports/bds-server/test_package.py -v
      # xmake walks up to the repository root's xmake.lua, which declares no
      # game_line option; -P is required to select the port project.
      - name: Configure
        shell: pwsh
        run: xmake f -P ports/bds-server -m release -a x64 --game_line=26.51 -y
      - name: Build mod
        shell: pwsh
        run: xmake build -P ports/bds-server -y karma-worldgen-bds
      # Seed baking samples landmarks with the SDK-free kernel CLI, so the
      # operator package must carry it alongside the DLL.
      - name: Build kernel tool
        shell: pwsh
        run: |
          $kernel = Join-Path $env:RUNNER_TEMP 'kernel'
          xmake f -P . -m release -a x64 -o $kernel -y
          if ($LASTEXITCODE) { throw 'Kernel configuration failed' }
          xmake build -P . -y native-worldgen-check
          if ($LASTEXITCODE) { throw 'Kernel build failed' }
      - name: Package
        id: package
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'shan-hai-bds'
          New-Item -ItemType Directory -Force $out | Out-Null
          $kernel = Join-Path $env:RUNNER_TEMP 'kernel/windows/x64/release/native-worldgen-check.exe'
          python -B -X utf8 ports/bds-server/package_bds.py `
            --binary ports/bds-server/build/windows/x64/release/karma-worldgen-bds.dll `
            --kernel-tool $kernel --output-dir $out
          if ($LASTEXITCODE) { throw 'Packaging failed' }
          $zip = Get-ChildItem $out -Filter *.zip | Select-Object -First 1
          if (!$zip -or $zip.Length -eq 0) { throw 'Missing package' }
          "name=$($zip.BaseName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "path=$($zip.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: ${{ steps.package.outputs.path }}
          if-no-files-found: error
      - name: Publish release
        if: inputs.publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content -Raw ports/bds-server/manifest.json | ConvertFrom-Json).version
          $tag = "bds-v$version"
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag "${{ steps.package.outputs.path }}" --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $tag "${{ steps.package.outputs.path }}" `
              --title "mountains&seas $version (BDS)" --generate-notes --repo $env:GITHUB_REPOSITORY
          }
          if ($LASTEXITCODE) { throw 'Release publication failed' }
