name: Windows client release
# Builds the Windows client mod. Runs on every push to main and on a manual
# dispatch; a version tag additionally publishes a GitHub release. The
# regression suite is a separate manual workflow so it cannot block a package.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Attach this package to the v<version> release'
        type: boolean
        default: false
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: xmake-io/github-action-setup-xmake@3a1a5dddfc7fa625d9a698738334bf55655a861a # v1
        with:
          xmake-version: '3.1.1'
          package-cache: true
          project-path: ports/windows-client
      # LeviLamina and its SDK dominate Configure time. Resolve the real cache
      # root first: ${{ env.X }} reads the workflow env block, not the runner's
      # environment, so LOCALAPPDATA has to come from the shell.
      - name: Resolve xmake cache paths
        id: xmake-cache
        shell: pwsh
        run: |
          $global = Join-Path $env:LOCALAPPDATA '.xmake'
          "packages=$(Join-Path $global 'packages')" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "cache=$(Join-Path $global 'cache')" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Cache xmake packages
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.xmake-cache.outputs.packages }}
            ${{ steps.xmake-cache.outputs.cache }}
          key: xmake-${{ runner.os }}-${{ hashFiles('xmake.lua', 'tooth.json', 'build-support/*.lua', 'ports/*/xmake.lua', 'src/kernel/xmake.lua') }}
          restore-keys: |
            xmake-${{ runner.os }}-
      - name: Install build tools
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vs = & $vswhere -latest -products '*' -version '[18.0,19.0)' -property installationPath
          $llvm = Join-Path $vs 'VC/Tools/Llvm/x64/bin'
          if (!(Test-Path (Join-Path $llvm 'clang-cl.exe'))) { throw 'Visual Studio 2026 LLVM is required' }
          $llvm | Out-File -FilePath $env:GITHUB_PATH -Append
          & (Join-Path $llvm 'clang-cl.exe') --version
          xmake --version
          python -m pip install numpy
          if ($LASTEXITCODE) { throw 'NumPy installation failed' }
      - name: Build and package
        id: package
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'shan-hai-build'
          ./build.ps1 -OutputDirectory $out -GameLine 26.51
          $version = (Get-Content -Raw ports/windows-client/manifest.json | ConvertFrom-Json).version
          $name = "mountains-and-seas-$version-Windows-MC1.26.51.01"
          $package = Join-Path $out "$name.zip"
          if (!(Test-Path -LiteralPath $package -PathType Leaf)) { throw "Missing package: $package" }
          if ((Get-Item -LiteralPath $package).Length -eq 0) { throw 'Empty package' }
          "name=$name" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "path=$package" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: ${{ steps.package.outputs.path }}
          if-no-files-found: error
      # The server package publishes to this same tag, so a concurrent run can
      # create the release between the lookup and the create call; retry once
      # and fall through to an upload instead of failing.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content -Raw ports/windows-client/manifest.json | ConvertFrom-Json).version
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { "v$version" }
          $asset = "${{ steps.package.outputs.path }}"
          $title = "mountains&seas $version"
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $asset --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $tag $asset --title $title --generate-notes --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE) {
              gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null | Out-Null
              if ($LASTEXITCODE -eq 0) {
                gh release upload $tag $asset --clobber --repo $env:GITHUB_REPOSITORY
              }
            }
          }
          if ($LASTEXITCODE) { throw 'Release publication failed' }
      - name: Collect build diagnostics
        if: always()
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'validation-logs'
          New-Item -ItemType Directory -Force $out | Out-Null
          $i = 0
          Get-ChildItem -LiteralPath (Join-Path $env:LOCALAPPDATA '.xmake/cache/packages') -Recurse -File -Filter install.txt -ErrorAction SilentlyContinue | ForEach-Object {
            Copy-Item -LiteralPath $_.FullName -Destination (Join-Path $out ("install-" + $i + ".txt"))
            $i++
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-logs
          path: ${{ runner.temp }}/validation-logs
