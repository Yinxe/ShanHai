name: BDS bisect
# Temporary: builds loader-only probes to locate the startup crash. Removed once
# the cause is fixed.
on:
  workflow_dispatch:
  push:
    branches: [bds-server]
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v4
      - uses: xmake-io/github-action-setup-xmake@3a1a5dddfc7fa625d9a698738334bf55655a861a # v1
        with:
          xmake-version: '3.1.1'
          package-cache: true
          project-path: ports/bds-server
      - name: Install LLVM
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vs = & $vswhere -latest -products '*' -version '[18.0,19.0)' -property installationPath
          $llvm = Join-Path $vs 'VC/Tools/Llvm/x64/bin'
          if (!(Test-Path (Join-Path $llvm 'clang-cl.exe'))) { throw 'Visual Studio 2026 LLVM is required' }
          $llvm | Out-File -FilePath $env:GITHUB_PATH -Append
          & (Join-Path $llvm 'clang-cl.exe') --version
      - name: Configure
        shell: pwsh
        run: xmake f -P ports/bds-server -m release -a x64 --game_line=26.51 -y
      - name: Build probe
        shell: pwsh
        run: xmake build -P ports/bds-server -y karma-worldgen-probe
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: probe-dll
          path: build/windows/x64/release/karma-worldgen-probe.dll
